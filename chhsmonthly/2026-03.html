

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #ffd700;
    --red: #b30000;
    --dark-red: #7a0000;
    --bg: #1a0a0a;
    --hl: #ff6b6b;
    --found: #ffd700;
  }
  #ws-root {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 8px 40px;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #ws-title {
    color: var(--gold);
    font-size: clamp(1.1rem, 5vw, 1.6rem);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
    text-align: center;
  }
  #ws-game {
    width: 100%;
    max-width: min(98vw, 480px);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #ws-grid {
    width: 100%;
    aspect-ratio: 1/1;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 1px;
    background: var(--gold);
    border: 3px solid var(--gold);
    border-radius: 4px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .cell {
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: clamp(0.55rem, 2.8vw, 1rem);
    cursor: pointer;
    transition: background 0.08s;
    color: white;
  }
  .cell.selecting { background: var(--hl); color: white; }
  .cell.found { background: var(--found); color: var(--dark-red); }
  #ws-words {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--gold);
    border-radius: 8px;
    padding: 12px 14px;
  }
  #ws-words h3 {
    color: var(--gold);
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 1px;
    border-bottom: 1px solid rgba(255,215,0,0.3);
    padding-bottom: 8px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  #ws-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    list-style: none;
  }
  .word-item {
    font-size: clamp(0.65rem, 2.5vw, 0.8rem);
    text-align: center;
    color: #ddd;
    padding: 3px 2px;
    line-height: 1.3;
  }
  .word-item.done {
    text-decoration: line-through;
    color: var(--gold);
    opacity: 0.6;
    font-weight: bold;
  }
  #ws-msg {
    text-align: center;
    font-size: 1.1rem;
    color: var(--gold);
    min-height: 1.4rem;
    letter-spacing: 1px;
  }
</style>
<div id="ws-root">
  <div id="ws-title">Lantern Festival Word Search</div>
  <div id="ws-game">
    <div id="ws-msg"></div>
    <div id="ws-grid"></div>
    <div id="ws-words">
      <h3>Word Bank</h3>
      <ul id="ws-list"></ul>
    </div>
  </div>
</div>
<script>
(function() {
  const SIZE = 12;
  const WORDS = ["LANTERN","LIGHT","RIDDLE","MOON","REUNION","CELEBRATION","TRADITION","SWEET","FAMILY","GLOWING","DECORATION","PARADE","FIREWORKS","JOY","HARMONY"];
  let grid = Array(SIZE * SIZE).fill('');
  let wordCells = {};
  let foundWords = [];
  let isSelecting = false;
  let selStart = null;
  let selCells = [];
  let cells = [];

  function placeWords() {
    WORDS.slice().sort((a,b) => b.length - a.length).forEach(w => {
      let placed = false, tries = 0;
      while (!placed && tries++ < 200) {
        const dir = Math.floor(Math.random() * 3);
        const r = Math.floor(Math.random() * SIZE);
        const c = Math.floor(Math.random() * SIZE);
        if (canPlace(w, r, c, dir)) {
          wordCells[w] = [];
          for (let i = 0; i < w.length; i++) {
            const nr = r + (dir===1||dir===2 ? i : 0);
            const nc = c + (dir===0||dir===2 ? i : 0);
            grid[nr*SIZE+nc] = w[i];
            wordCells[w].push(nr*SIZE+nc);
          }
          placed = true;
        }
      }
    });
  }

  function canPlace(w, r, c, dir) {
    for (let i = 0; i < w.length; i++) {
      const nr = r + (dir===1||dir===2 ? i : 0);
      const nc = c + (dir===0||dir===2 ? i : 0);
      if (nr >= SIZE || nc >= SIZE) return false;
      const cur = grid[nr*SIZE+nc];
      if (cur && cur !== w[i]) return false;
    }
    return true;
  }

  function fillRandom() {
    for (let i = 0; i < grid.length; i++) {
      if (!grid[i]) grid[i] = String.fromCharCode(65 + Math.floor(Math.random() * 26));
    }
  }

  function renderGrid() {
    const el = document.getElementById('ws-grid');
    el.innerHTML = '';
    cells = [];
    grid.forEach((ch, i) => {
      const d = document.createElement('div');
      d.className = 'cell';
      d.textContent = ch;
      d.dataset.i = i;
      el.appendChild(d);
      cells.push(d);
    });
  }

  function renderList() {
    const ul = document.getElementById('ws-list');
    ul.innerHTML = '';
    WORDS.slice().sort().forEach(w => {
      const li = document.createElement('li');
      li.className = 'word-item';
      li.id = 'wli-'+w;
      li.textContent = w;
      ul.appendChild(li);
    });
  }

  function idxFromPoint(x, y) {
    const el = document.elementFromPoint(x, y);
    if (el && el.classList.contains('cell')) return parseInt(el.dataset.i);
    return -1;
  }

  function getLine(a, b) {
    if (a < 0 || b < 0) return [];
    const r1 = Math.floor(a/SIZE), c1 = a%SIZE;
    const r2 = Math.floor(b/SIZE), c2 = b%SIZE;
    const dr = r2-r1, dc = c2-c1;
    const len = Math.max(Math.abs(dr), Math.abs(dc));
    if (len === 0) return [a];
    const sr = dr === 0 ? 0 : dr/Math.abs(dr);
    const sc = dc === 0 ? 0 : dc/Math.abs(dc);
    if (dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) return [a];
    const line = [];
    for (let i = 0; i <= len; i++) {
      line.push((r1+sr*i)*SIZE + (c1+sc*i));
    }
    return line;
  }

  function applySelection(line) {
    cells.forEach(c => { if (!c.classList.contains('found')) c.classList.remove('selecting'); });
    line.forEach(i => { if (i >= 0 && i < cells.length && !cells[i].classList.contains('found')) cells[i].classList.add('selecting'); });
  }

  function checkWord(line) {
    const str = line.map(i => grid[i]).join('');
    const rev = str.split('').reverse().join('');
    for (const w of WORDS) {
      if ((str === w || rev === w) && !foundWords.includes(w)) {
        foundWords.push(w);
        line.forEach(i => { cells[i].classList.remove('selecting'); cells[i].classList.add('found'); });
        document.getElementById('wli-'+w).classList.add('done');
        if (foundWords.length === WORDS.length) {
          document.getElementById('ws-msg').textContent = 'Happy Lantern Festival! All words found!';
        }
        return;
      }
    }
    cells.forEach(c => c.classList.remove('selecting'));
  }

  function xy(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function onStart(e) {
    e.preventDefault();
    isSelecting = true;
    const {x,y} = xy(e);
    const idx = idxFromPoint(x, y);
    selStart = idx;
    selCells = getLine(idx, idx);
    applySelection(selCells);
  }

  function onMove(e) {
    if (!isSelecting) return;
    e.preventDefault();
    const {x,y} = xy(e);
    const idx = idxFromPoint(x, y);
    if (idx < 0) return;
    selCells = getLine(selStart, idx);
    applySelection(selCells);
  }

  function onEnd(e) {
    if (!isSelecting) return;
    e.preventDefault();
    isSelecting = false;
    checkWord(selCells);
    selStart = null;
    selCells = [];
  }

  const gridEl = document.getElementById('ws-grid');
  gridEl.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
  gridEl.addEventListener('touchstart', onStart, {passive: false});
  window.addEventListener('touchmove', onMove, {passive: false});
  window.addEventListener('touchend', onEnd, {passive: false});

  placeWords();
  fillRandom();
  renderGrid();
  renderList();
})();
</script>
