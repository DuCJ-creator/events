

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ivory: #f5f0e8;
    --cream: #ede5d0;
    --parchment: #d4c5a0;
    --ink: #1c1409;
    --mahogany: #5c2a0e;
    --gold: #b8860b;
    --gold-light: #d4a017;
    --accent: #8b1a1a;
  }
  #orch-root {
    background: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 8px 48px;
    font-family: 'Crimson Text', Georgia, serif;
    color: var(--ink);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .o-header {
    text-align: center;
    margin-bottom: 18px;
  }
  .o-subtitle {
    font-family: 'Crimson Text', serif;
    font-style: italic;
    color: var(--parchment);
    font-size: 0.9rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.8;
    margin-bottom: 4px;
  }
  .o-title {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: clamp(1.5rem, 6vw, 2.8rem);
    color: var(--gold-light);
    letter-spacing: 2px;
    line-height: 1;
  }
  .o-ornament {
    color: var(--gold);
    font-size: 1.1rem;
    letter-spacing: 6px;
    margin-top: 6px;
    opacity: 0.7;
  }
  .o-game {
    width: 100%;
    max-width: min(98vw, 500px);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .o-grid-panel {
    background: var(--ivory);
    border-radius: 4px;
    padding: 5px;
    border: 3px solid var(--gold);
    position: relative;
  }
  #o-grid {
    display: grid;
    grid-template-columns: repeat(11, 1fr);
    background: var(--cream);
    border-radius: 2px;
    overflow: hidden;
    width: 100%;
    aspect-ratio: 1/1;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .cell {
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: clamp(0.55rem, 2.5vw, 0.95rem);
    cursor: pointer;
    color: var(--ink);
    border: 0.5px solid rgba(212,197,160,0.4);
    transition: background 0.08s;
  }
  .cell.selecting { background: var(--gold-light); color: var(--ivory); }
  .cell.found { background: var(--mahogany); color: var(--gold-light); }
  .o-word-list {
    background: rgba(245,240,232,0.06);
    padding: 14px 16px;
    border-radius: 4px;
    border: 1px solid rgba(184,134,11,0.4);
  }
  .o-word-list h3 {
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    color: var(--gold-light);
    text-align: center;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 400;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(184,134,11,0.3);
    margin-bottom: 10px;
  }
  #o-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px 10px;
    list-style: none;
  }
  .word-item {
    font-family: 'Crimson Text', serif;
    font-size: clamp(0.7rem, 2.4vw, 0.95rem);
    text-align: center;
    color: var(--parchment);
    padding: 3px 2px;
  }
  .word-item.done {
    text-decoration: line-through;
    color: var(--gold);
    opacity: 0.5;
  }
  .o-progress-wrap {
    margin-top: 12px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    height: 4px;
    overflow: hidden;
  }
  .o-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--mahogany), var(--gold-light));
    width: 0%;
    transition: width 0.4s ease;
  }
  .o-score {
    text-align: center;
    margin-top: 6px;
    font-family: 'Crimson Text', serif;
    font-style: italic;
    color: var(--parchment);
    font-size: 0.85rem;
    opacity: 0.7;
  }
  .o-win {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(28,20,9,0.9);
    z-index: 50;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
  }
  .o-win.show { display: flex; }
  .o-win-box {
    background: var(--ivory);
    border: 2px solid var(--gold);
    border-radius: 6px;
    padding: 24px 28px;
    text-align: center;
    max-width: 260px;
  }
  .o-win-box h2 {
    font-family: 'Playfair Display', serif;
    color: var(--mahogany);
    font-size: 1.6rem;
    margin-bottom: 8px;
  }
  .o-win-box p {
    font-family: 'Crimson Text', serif;
    color: var(--ink);
    font-size: 1rem;
    font-style: italic;
    margin-bottom: 16px;
  }
  .o-win-box button {
    background: var(--mahogany);
    color: var(--gold-light);
    border: 2px solid var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 0.9rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 9px 24px;
    cursor: pointer;
    border-radius: 3px;
  }
</style>
<div id="orch-root">
  <div class="o-header">
    <p class="o-subtitle">A Musical</p>
    <div class="o-title">Word Search</div>
    <div class="o-ornament">♩ ♪ ♫ ♬</div>
  </div>
  <div class="o-game">
    <div class="o-grid-panel">
      <div id="o-grid"></div>
      <div class="o-win" id="o-win">
        <div class="o-win-box">
          <h2>Bravo! 🎼</h2>
          <p>You found every instrument in the orchestra!</p>
          <button id="o-restart">Play Again</button>
        </div>
      </div>
    </div>
    <div class="o-word-list">
      <h3>Instruments &amp; Terms</h3>
      <ul id="o-list"></ul>
      <div class="o-progress-wrap"><div class="o-progress-bar" id="o-progress"></div></div>
      <div class="o-score" id="o-score">0 of 15 found</div>
    </div>
  </div>
</div>
<script>
(function() {
  const SIZE = 11;
  const WORDS = ["VIOLIN","VIOLA","CELLO","BASS","FLUTE","CLARINET","OBOE","BASSOON","TRUMPET","TROMBONE","PERCUSSION","HARP","PIANO","ORCHESTRA","SYMPHONY"];
  let grid = [], foundWords = [], cells = [];
  let isSelecting = false, selStart = -1, selCells = [];

  function placeWords() {
    grid = Array(SIZE * SIZE).fill('');
    [...WORDS].sort((a,b) => b.length - a.length).forEach(w => {
      let placed = false, tries = 0;
      while (!placed && tries++ < 300) {
        const dir = Math.floor(Math.random() * 5);
        const r = Math.floor(Math.random() * SIZE);
        const c = Math.floor(Math.random() * SIZE);
        if (canPlace(w, r, c, dir)) {
          for (let i = 0; i < w.length; i++) {
            const [nr, nc] = step(r, c, dir, i);
            grid[nr * SIZE + nc] = w[i];
          }
          placed = true;
        }
      }
    });
    for (let i = 0; i < grid.length; i++) {
      if (!grid[i]) grid[i] = String.fromCharCode(65 + Math.floor(Math.random() * 26));
    }
  }

  function step(r, c, dir, i) {
    if (dir === 0) return [r, c + i];
    if (dir === 1) return [r + i, c];
    if (dir === 2) return [r + i, c + i];
    if (dir === 3) return [r, c - i];
    return [r - i, c];
  }

  function canPlace(w, r, c, dir) {
    for (let i = 0; i < w.length; i++) {
      const [nr, nc] = step(r, c, dir, i);
      if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) return false;
      const ex = grid[nr * SIZE + nc];
      if (ex && ex !== w[i]) return false;
    }
    return true;
  }

  function getLine(a, b) {
    if (a < 0 || b < 0) return [a];
    const r1 = Math.floor(a/SIZE), c1 = a%SIZE;
    const r2 = Math.floor(b/SIZE), c2 = b%SIZE;
    const dr = r2-r1, dc = c2-c1;
    const len = Math.max(Math.abs(dr), Math.abs(dc));
    if (len === 0) return [a];
    const sr = dr === 0 ? 0 : dr/Math.abs(dr);
    const sc = dc === 0 ? 0 : dc/Math.abs(dc);
    if (dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) return [a];
    const line = [];
    for (let i = 0; i <= len; i++) line.push((r1+sr*i)*SIZE+(c1+sc*i));
    return line;
  }

  function idxAt(x, y) {
    const el = document.elementFromPoint(x, y);
    return (el && el.dataset.idx !== undefined) ? parseInt(el.dataset.idx) : -1;
  }

  function applyHL(line) {
    cells.forEach(c => { if (!c.classList.contains('found')) c.classList.remove('selecting'); });
    line.forEach(i => { if (i >= 0 && !cells[i].classList.contains('found')) cells[i].classList.add('selecting'); });
  }

  function checkWord(line) {
    const s = line.map(i => grid[i]).join('');
    const r = s.split('').reverse().join('');
    for (const w of WORDS) {
      if ((s === w || r === w) && !foundWords.includes(w)) {
        foundWords.push(w);
        line.forEach(i => { cells[i].classList.remove('selecting'); cells[i].classList.add('found'); });
        document.getElementById('wli-'+w).classList.add('done');
        updateProgress();
        if (foundWords.length === WORDS.length) {
          setTimeout(() => document.getElementById('o-win').classList.add('show'), 400);
        }
        return;
      }
    }
    cells.forEach(c => c.classList.remove('selecting'));
  }

  function updateProgress() {
    const pct = (foundWords.length / WORDS.length) * 100;
    document.getElementById('o-progress').style.width = pct + '%';
    document.getElementById('o-score').textContent = foundWords.length + ' of ' + WORDS.length + ' found';
  }

  function xy(e) {
    return e.touches && e.touches.length
      ? { x: e.touches[0].clientX, y: e.touches[0].clientY }
      : { x: e.clientX, y: e.clientY };
  }

  function onStart(e) { e.preventDefault(); isSelecting = true; const {x,y}=xy(e); selStart=idxAt(x,y); selCells=getLine(selStart,selStart); applyHL(selCells); }
  function onMove(e) { if (!isSelecting) return; e.preventDefault(); const {x,y}=xy(e); const idx=idxAt(x,y); if (idx<0) return; selCells=getLine(selStart,idx); applyHL(selCells); }
  function onEnd(e) { if (!isSelecting) return; e.preventDefault(); isSelecting=false; checkWord(selCells); selStart=-1; selCells=[]; }

  function render() {
    const gridEl = document.getElementById('o-grid');
    gridEl.innerHTML = '';
    cells = [];
    grid.forEach((ch, i) => {
      const d = document.createElement('div');
      d.className = 'cell';
      d.textContent = ch;
      d.dataset.idx = i;
      gridEl.appendChild(d);
      cells.push(d);
    });
    gridEl.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
    gridEl.addEventListener('touchstart', onStart, {passive:false});
    window.addEventListener('touchmove', onMove, {passive:false});
    window.addEventListener('touchend', onEnd, {passive:false});
  }

  function renderList() {
    const ul = document.getElementById('o-list');
    ul.innerHTML = '';
    [...WORDS].sort().forEach(w => {
      const li = document.createElement('li');
      li.className = 'word-item';
      li.id = 'wli-'+w;
      li.textContent = w;
      ul.appendChild(li);
    });
  }

  function init() {
    foundWords = [];
    document.getElementById('o-win').classList.remove('show');
    placeWords();
    render();
    renderList();
    updateProgress();
  }

  document.getElementById('o-restart').addEventListener('click', init);
  init();
})();
</script>
