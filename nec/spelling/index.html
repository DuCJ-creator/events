<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>全國單字比賽線上答題平台</title>
  <!-- Google Fonts & Tailwind CSS CDN -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              yellow: '#FFDE59',
              pink: '#FF914D',
              purple: '#8C52FF',
              blue: '#00C2CB',
              bg: '#F4F7FE'
            }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', 'Fredoka', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #F4F7FE; }
    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card-hover:hover { transform: translateY(-5px); box-shadow: 0 12px 24px -8px rgba(140, 82, 255, 0.25); }
    .tab-btn.active { background-color: #8C52FF; color: #fff; }
  </style>
</head>
<body class="font-sans text-gray-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b-4 border-brand-yellow px-6 py-4 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3 cursor-pointer" onclick="showDashboard()">
      <div class="w-10 h-10 rounded-2xl bg-brand-yellow flex items-center justify-center font-bold text-xl text-brand-purple shadow-sm">
        ✏️
      </div>
      <h1 class="text-xl font-bold text-gray-800 tracking-wide">全國單字比賽線上答題平台</h1>
    </div>
    <button id="backBtn" onclick="showDashboard()" class="hidden bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-sm font-semibold transition">
      ← 返回選單
    </button>
  </header>

  <!-- 主內容區 -->
  <main class="flex-1 p-6 max-w-7xl mx-auto w-full">

    <!-- 卡片選擇區 (Dashboard) -->
    <div id="dashboardSection">
      <div class="text-center my-8">
        <h2 class="text-3xl font-extrabold text-gray-800 mb-2">請選擇歷屆考古題年度</h2>
        <p class="text-gray-500">點選年份即可進入線上聽力與閱讀模擬答題</p>
      </div>

      <div id="cardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mt-8">
        <!-- 載入中動畫 -->
        <div class="col-span-full text-center py-12">
          <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-brand-purple border-t-transparent"></div>
          <p class="mt-3 text-gray-500">正在讀取題庫清單...</p>
        </div>
      </div>
    </div>

    <!-- 答題與閱讀區 (Exam View) -->
    <div id="examSection" class="hidden flex flex-col h-[calc(100vh-140px)] gap-4">

      <!-- 上方：音訊播放器 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center justify-between gap-4 flex-wrap">
        <div class="flex items-center gap-3">
          <span class="p-2 bg-brand-yellow/30 rounded-xl text-2xl">🎧</span>
          <div>
            <h3 id="examTitle" class="font-bold text-gray-800">單字比賽考題</h3>
            <p id="audioHint" class="text-xs text-gray-400">點擊播放器開始聽力答題</p>
          </div>
        </div>
        <div class="flex-1 min-w-[240px] max-w-xl">
          <audio id="audioPlayer" controls class="w-full h-10">
            您的瀏覽器不支援音訊播放。
          </audio>
        </div>
        <a id="answerPdfLink" href="#" target="_blank" rel="noopener"
           class="hidden text-xs font-semibold text-brand-purple border border-brand-purple rounded-lg px-3 py-2 hover:bg-brand-purple hover:text-white transition whitespace-nowrap">
          📄 官方答案卷 PDF
        </a>
      </div>

      <!-- 下方主體：左側 PDF 試題，右側答題面板 -->
      <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 auto-rows-fr gap-4 min-h-0">

        <!-- 左側：PDF 檢視器 (佔 7 欄) -->
        <div class="lg:col-span-7 bg-white rounded-2xl p-2 shadow-sm border border-gray-100 flex flex-col h-full min-h-0">
          <div class="px-3 py-2 text-xs font-semibold text-gray-500 flex justify-between items-center border-b mb-2">
            <span>📄 試題卷預覽</span>
            <span class="text-gray-400">可自由滾動捲頁（與右側答題區各自獨立捲動）</span>
          </div>
          <iframe id="pdfFrame" class="w-full flex-1 rounded-xl border-0" src=""></iframe>
        </div>

        <!-- 右側：線上答題 Panel (佔 5 欄) -->
        <div class="lg:col-span-5 bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col h-full min-h-0">
          <div class="flex justify-between items-center pb-3 border-b mb-3">
            <h4 class="font-bold text-gray-800 text-lg flex items-center gap-2">
              <span>✍️</span> 線上答題區
            </h4>
            <span id="scoreBadge" class="hidden px-3 py-1 bg-brand-yellow font-bold text-brand-purple rounded-full text-sm"></span>
          </div>

          <!-- 測驗一 / 測驗二 切換頁籤 -->
          <div class="flex gap-2 mb-3">
            <button id="tabTest1" onclick="switchTab('test1')" class="tab-btn active flex-1 py-2 rounded-xl text-sm font-bold border border-brand-purple text-brand-purple transition">
              測驗一 聽英拼寫 (1-50)
            </button>
            <button id="tabTest2" onclick="switchTab('test2')" class="tab-btn flex-1 py-2 rounded-xl text-sm font-bold border border-brand-purple text-brand-purple transition">
              測驗二 詞彙題 (1-50)
            </button>
          </div>

          <!-- 題目卡片滾動區：兩個 section 常駐 DOM，用顯示/隱藏切換，避免切頁籤時遺失已填答案 -->
          <div class="flex-1 min-h-0 overflow-y-auto pr-2">
            <div id="test1Container" class="space-y-3"></div>
            <div id="test2Container" class="space-y-3 hidden"></div>
          </div>

          <!-- 下方提交按鈕 -->
          <div class="pt-4 border-t mt-auto">
            <button id="submitBtn" onclick="gradeExam()" class="w-full bg-brand-purple hover:bg-opacity-90 text-white font-bold py-3 rounded-xl shadow-md transition transform active:scale-95">
              提交答案並批改 🚀
            </button>
          </div>
        </div>

      </div>
    </div>

  </main>

  <script>
    // ============================================================
    // 純靜態版本：不再依賴 Google Apps Script / Google Drive。
    // 所有資料都用相對路徑的 fetch() 從同一個 GitHub repo 內讀取：
    //   exams/manifest.json      -> 有哪些年度、各年度的檔案路徑
    //   exams/<year>/answers.json -> 該年度的正確答案（格式見下方 parseAnswerKeyJson）
    //   exams/<year>/booklet.pdf  -> 題本 PDF
    //   exams/<year>/audio.mp3    -> 聽力音檔
    //   exams/<year>/answer_sheet.pdf -> 官方答案卷 PDF（僅供參考連結，非必要）
    //
    // 注意：用 file:// 直接雙擊打開這個 index.html 在部分瀏覽器（尤其 Chrome）
    // 會因為安全性限制擋掉 fetch() 讀取本機檔案。請透過 GitHub Pages
    // 或任何本機開發伺服器（例如 `npx serve`、`python3 -m http.server`）開啟。
    // ============================================================

    let EXAMS = [];              // manifest.exams
    let examMetaByYear = {};     // year -> manifest entry
    let answerKeysCache = {};    // year -> 解析後的題目陣列（100 題扁平化格式）
    let currentYear = null;

    window.onload = async function () {
      try {
        const res = await fetch('exams/manifest.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const manifest = await res.json();
        EXAMS = manifest.exams || [];
        EXAMS.forEach(e => { examMetaByYear[e.year] = e; });

        // 預先載入各年度答案 JSON，讀不到（尚未建置）就當作空題庫，不中斷流程
        await Promise.all(EXAMS.map(async (exam) => {
          try {
            const r = await fetch(exam.answers);
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const raw = await r.json();
            answerKeysCache[exam.year] = parseAnswerKeyJson(raw);
          } catch (e) {
            answerKeysCache[exam.year] = [];
          }
        }));

        renderCards();
      } catch (err) {
        document.getElementById('cardGrid').innerHTML = `
          <div class="col-span-full text-center text-rose-500 py-12">
            讀取 exams/manifest.json 失敗：${err.message}<br>
            <span class="text-xs text-gray-400">若您是用「雙擊打開檔案」的方式開啟，請改用 GitHub Pages 或本機伺服器開啟。</span>
          </div>`;
      }
    };

    /**
     * 將 answers.json 的原始資料，轉換成前端需要的扁平化題目陣列
     * （測驗一 id: s1~s50，測驗二 id: v1~v50）。
     * 資料格式：
     * {
     *   "spelling": ["abdomen", "lieutenant/Lieutenant", ...],
     *   "singleChoice": [{ "sentence": "...", "options": [...], "answer": "..." }, ...],
     *   "groups": [{ "options": [...5個], "items": [{ "sentence": "...", "answer": "..." }, ...] }, ...]
     * }
     */
    function parseAnswerKeyJson(data) {
      const questions = [];

      (data.spelling || []).forEach((word, idx) => {
        const accepted = String(word).split('/').map(w => w.trim()).filter(Boolean);
        questions.push({
          id: `s${idx + 1}`,
          section: "test1",
          type: "spelling",
          no: idx + 1,
          prompt: `第 ${idx + 1} 題（聽英拼寫）`,
          accepted: accepted,
          answer: accepted[0]
        });
      });

      let vNo = 0;

      (data.singleChoice || []).forEach(q => {
        vNo++;
        questions.push({
          id: `v${vNo}`,
          section: "test2",
          type: "mcq",
          no: vNo,
          prompt: `${vNo}. ${q.sentence}`,
          options: q.options,
          answer: q.answer
        });
      });

      (data.groups || []).forEach(group => {
        (group.items || []).forEach(item => {
          vNo++;
          questions.push({
            id: `v${vNo}`,
            section: "test2",
            type: "mcq",
            no: vNo,
            prompt: `${vNo}. ${item.sentence}`,
            options: group.options,
            answer: item.answer
          });
        });
      });

      return questions;
    }

    // 渲染卡片選單
    function renderCards() {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      if (EXAMS.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12">exams/manifest.json 內沒有任何年度資料。</div>`;
        return;
      }

      const colors = ['bg-amber-100 text-amber-800', 'bg-teal-100 text-teal-800', 'bg-indigo-100 text-indigo-800', 'bg-rose-100 text-rose-800'];

      EXAMS.forEach((exam, idx) => {
        const questionCount = (answerKeysCache[exam.year] || []).length;
        const card = document.createElement('div');
        card.className = "bg-white rounded-3xl p-6 card-hover border-2 border-transparent hover:border-brand-purple cursor-pointer shadow-sm flex flex-col justify-between";
        card.onclick = () => openExam(exam.year);

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-4">
              <span class="px-3 py-1 rounded-full text-xs font-bold ${colors[idx % colors.length]}">${exam.year} 學年度</span>
              <span class="text-2xl">🏆</span>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">${exam.name}</h3>
            <p class="text-xs text-gray-400">${questionCount > 0 ? `共 ${questionCount} 題，含音訊試題、卷本與自動批改` : '題庫建置中，可先預覽試題卷與音檔'}</p>
          </div>
          <div class="mt-6 flex items-center text-brand-purple font-bold text-sm">
            <span>開始答題</span>
            <span class="ml-1">→</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // 打開指定年份的測試
    function openExam(year) {
      currentYear = year;
      const exam = examMetaByYear[year];
      const questions = answerKeysCache[year] || [];

      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('examSection').classList.remove('hidden');
      document.getElementById('backBtn').classList.remove('hidden');

      document.getElementById('examTitle').innerText = `${year} 年全國單字比賽模擬卷`;

      // 音檔：真正的靜態檔案，原生 <audio> 即可正常播放與拖曳進度
      const audioPlayer = document.getElementById('audioPlayer');
      const audioHint = document.getElementById('audioHint');
      audioPlayer.src = exam.audio || "";
      audioHint.innerText = '點擊播放器開始聽力答題';
      audioPlayer.onerror = () => {
        audioHint.innerText = '⚠️ 尚未找到音檔（' + (exam.audio || '') + '），請確認已上傳到對應資料夾。';
      };

      // PDF 試題卷
      document.getElementById('pdfFrame').src = exam.pdf || "";

      // 官方答案卷 PDF 參考連結（若有提供）
      const answerLink = document.getElementById('answerPdfLink');
      if (exam.answerPdf) {
        answerLink.href = exam.answerPdf;
        answerLink.classList.remove('hidden');
      } else {
        answerLink.classList.add('hidden');
      }

      // 渲染答題 Panel
      renderQuestions(questions);
      switchTab('test1');
    }

    // 切換測驗一 / 測驗二 頁籤
    function switchTab(section) {
      document.getElementById('test1Container').classList.toggle('hidden', section !== 'test1');
      document.getElementById('test2Container').classList.toggle('hidden', section !== 'test2');
      document.getElementById('tabTest1').classList.toggle('active', section === 'test1');
      document.getElementById('tabTest2').classList.toggle('active', section === 'test2');
    }

    // 渲染答題介面
    function renderQuestions(questions) {
      const test1El = document.getElementById('test1Container');
      const test2El = document.getElementById('test2Container');
      test1El.innerHTML = '';
      test2El.innerHTML = '';
      document.getElementById('scoreBadge').classList.add('hidden');

      const submitBtn = document.getElementById('submitBtn');
      if (questions.length === 0) {
        test1El.innerHTML = `<p class="text-sm text-gray-400 text-center py-10">此年度「聽英拼寫」題庫尚未建置，可先預覽左側試題卷與音檔。</p>`;
        test2El.innerHTML = `<p class="text-sm text-gray-400 text-center py-10">此年度「詞彙題」題庫尚未建置，可先預覽左側試題卷與音檔。</p>`;
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-40', 'cursor-not-allowed');
        return;
      }
      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-40', 'cursor-not-allowed');

      questions.forEach(q => {
        const qCard = document.createElement('div');
        qCard.className = "p-3 rounded-xl border border-gray-100 bg-gray-50 flex flex-col gap-2";
        qCard.id = `qCard_${q.id}`;

        let inputHtml = '';
        if (q.type === 'spelling') {
          inputHtml = `
            <input type="text" id="ans_${q.id}" placeholder="請輸入單字拼寫..."
                   class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-brand-purple bg-white text-sm">
          `;
        } else if (q.type === 'mcq') {
          inputHtml = `<div class="flex flex-wrap gap-x-4 gap-y-1 mt-1">`;
          q.options.forEach(opt => {
            inputHtml += `
              <label class="flex items-center gap-1 cursor-pointer text-sm font-medium">
                <input type="radio" name="ans_${q.id}" value="${opt}" class="text-brand-purple focus:ring-brand-purple">
                <span>${opt}</span>
              </label>
            `;
          });
          inputHtml += `</div>`;
        }

        qCard.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <span class="font-semibold text-sm text-gray-700 leading-snug">${q.prompt}</span>
            <span id="result_${q.id}" class="text-xs font-bold whitespace-nowrap"></span>
          </div>
          ${inputHtml}
          <div id="correct_${q.id}" class="text-xs text-emerald-600 font-semibold hidden"></div>
        `;

        (q.section === 'test1' ? test1El : test2El).appendChild(qCard);
      });
    }

    // 自動批改
    function gradeExam() {
      const questions = answerKeysCache[currentYear] || [];
      if (questions.length === 0) return;
      let correctCount = 0;

      questions.forEach(q => {
        let userAns = "";
        if (q.type === 'spelling') {
          const input = document.getElementById(`ans_${q.id}`);
          userAns = input ? input.value.trim() : "";
        } else if (q.type === 'mcq') {
          const checked = document.querySelector(`input[name="ans_${q.id}"]:checked`);
          userAns = checked ? checked.value : "";
        }

        let isCorrect = false;
        if (q.type === 'spelling') {
          const accepted = (q.accepted || [q.answer]).map(a => a.toLowerCase());
          isCorrect = accepted.includes(userAns.toLowerCase());
        } else {
          isCorrect = userAns.toLowerCase() === q.answer.toLowerCase();
        }

        if (isCorrect) correctCount++;

        const resultSpan = document.getElementById(`result_${q.id}`);
        const correctDiv = document.getElementById(`correct_${q.id}`);
        const card = document.getElementById(`qCard_${q.id}`);

        if (isCorrect) {
          resultSpan.innerText = "✓ 正確";
          resultSpan.className = "text-xs font-bold text-emerald-500 whitespace-nowrap";
          card.className = "p-3 rounded-xl border border-emerald-200 bg-emerald-50/30 flex flex-col gap-2";
          correctDiv.classList.add('hidden');
        } else {
          resultSpan.innerText = "✗ 錯誤";
          resultSpan.className = "text-xs font-bold text-rose-500 whitespace-nowrap";
          card.className = "p-3 rounded-xl border border-rose-200 bg-rose-50/30 flex flex-col gap-2";
          const correctText = q.type === 'spelling' && q.accepted && q.accepted.length > 1
            ? q.accepted.join(' / ')
            : q.answer;
          correctDiv.innerText = `正確答案：${correctText}`;
          correctDiv.classList.remove('hidden');
        }
      });

      const score = Math.round((correctCount / questions.length) * 100);
      const scoreBadge = document.getElementById('scoreBadge');
      scoreBadge.innerText = `得分：${score} 分 (${correctCount}/${questions.length})`;
      scoreBadge.classList.remove('hidden');
    }

    // 切換回 Dashboard
    function showDashboard() {
      document.getElementById('examSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      document.getElementById('backBtn').classList.add('hidden');
      const audioPlayer = document.getElementById('audioPlayer');
      audioPlayer.pause();
      audioPlayer.src = '';
    }
  </script>
</body>
</html>
