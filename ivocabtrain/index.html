<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iVocab2.0 教師端 操作流程組訓</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #1e3a8a;          /* 學術深藍 (Academic Navy) */
      --primary-hover: #1e40af;
      --bg-color: #f7f6f2;          /* 溫潤象牙紙張背景 */
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --card-border: #cbd5e1;
      --accent-green: #059669;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      padding-bottom: 120px;
      line-height: 1.6;
    }

    /* 頂部標題 */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 24px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 12px rgba(0,0,0,0.03);
    }

    header h1 {
      margin: 0 0 6px 0;
      font-size: 24px;
      font-family: "Georgia", "Times New Roman", "Noto Serif TC", serif;
      font-weight: 700;
      color: var(--primary);
    }

    header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* 主流程容器 */
    .flow-container {
      max-width: 900px;
      margin: 36px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 步驟卡片 */
    .step-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      width: 100%;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 32px;
      animation: fadeInUp 0.4s ease forwards;
      position: relative;
      border-left: 5px solid var(--primary);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 畫面展示區 */
    .phone-mockup {
      width: 320px;
      max-width: 45%;
      height: auto;
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 6px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .phone-mockup:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(30, 58, 138, 0.12);
    }

    .phone-mockup::after {
      content: "🔍 點擊放大";
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 41, 59, 0.85);
      color: #ffffff;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .phone-mockup:hover::after {
      opacity: 1;
    }

    .phone-screen {
      background: #f8fafc;
      border-radius: 8px;
      width: 100%;
      height: auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone-screen img {
      width: 100%;
      height: auto;
      max-height: 480px;
      display: block;
      object-fit: contain;
    }

    .image-placeholder {
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    .image-placeholder i {
      font-size: 36px;
      margin-bottom: 8px;
      color: #94a3b8;
    }

    /* 步驟說明區 */
    .step-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      color: var(--primary);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
      padding: 4px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      width: fit-content;
      border: 1px solid #e2e8f0;
    }

    .step-info h3 {
      margin: 0 0 10px 0;
      font-size: 20px;
      font-family: "Georgia", "Times New Roman", "Noto Serif TC", serif;
      color: var(--primary);
      line-height: 1.4;
    }

    .step-info p {
      margin: 0;
      color: #334155;
      line-height: 1.7;
      font-size: 15px;
    }

    /* 連接箭頭 */
    .flow-arrow {
      color: #94a3b8;
      font-size: 20px;
      margin: 14px 0;
      animation: fadeIn 0.3s ease;
    }

    /* 底部控制列 */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
      z-index: 100;
    }

    .progress-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 200px;
    }

    .progress-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
    }

    .progress-bar-bg {
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
      width: 100%;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-next {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-next:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
    }

    .btn-next:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-reset, .btn-pdf {
      background: #f8fafc;
      color: #475569;
      border: 1px solid #cbd5e1;
    }

    .btn-reset:hover, .btn-pdf:hover {
      background: #f1f5f9;
      color: var(--primary);
    }

    /* Modal 放大圖片 */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      background: #fff;
      padding: 8px;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ==========================================
       🖨️ PDF / 列印單頁 Flowchart 專屬排版 CSS
       ========================================== */
    @media print {
      @page {
        size: A4 landscape; /* 強制 A4 橫向 */
        margin: 5mm;
      }

      body {
        background: #ffffff !important;
        padding: 0 !important;
        color: #000000 !important;
      }

      header p, .bottom-bar, .flow-arrow, .modal, .phone-mockup::after {
        display: none !important;
      }

      header {
        position: static !important;
        box-shadow: none !important;
        border: none !important;
        padding: 4px 0 8px 0 !important;
      }

      header h1 {
        font-size: 18px !important;
        margin: 0 !important;
      }

      .flow-container {
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        display: grid !important;
        grid-template-columns: repeat(4, 1fr) !important; /* 4 欄 */
        grid-template-rows: repeat(3, 1fr) !important;    /* 3 列 = 12 格一頁紙 */
        gap: 6px !important;
      }

      .step-card {
        border: 1px solid #cbd5e1 !important;
        border-left: 3px solid #1e3a8a !important;
        box-shadow: none !important;
        padding: 6px !important;
        border-radius: 6px !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: flex-start !important;
        gap: 4px !important;
        page-break-inside: avoid !important;
        height: 100% !important;
      }

      .phone-mockup {
        width: 100% !important;
        max-width: 100% !important;
        height: 100px !important;
        padding: 2px !important;
        border-radius: 4px !important;
        border: none !important;
        box-shadow: none !important;
        background: transparent !important;
      }

      .phone-screen img {
        max-height: 96px !important;
        object-fit: contain !important;
      }

      .step-badge {
        font-size: 9px !important;
        padding: 1px 4px !important;
        margin-bottom: 2px !important;
      }

      .step-info h3 {
        font-size: 11px !important;
        margin: 0 0 2px 0 !important;
        line-height: 1.2 !important;
      }

      .step-info p {
        font-size: 9px !important;
        line-height: 1.25 !important;
        color: #334155 !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>iVocab2.0 教師端 操作流程組訓</h1>
    <p>請老師們對照 1Campus-iVocab2.0，逐步熟悉操作（可點擊截圖放大檢視，或使用方向鍵 鍵盤操控）</p>
  </header>

  <div class="flow-container" id="flowContainer"></div>

  <div class="bottom-bar">
    <div class="progress-info">
      <span class="progress-text" id="progressText">進度：步驟 1 / 12</span>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-pdf" onclick="exportPDF()">
        <i class="fa-solid fa-file-pdf"></i> 匯出 PDF 流程圖
      </button>
      <button class="btn-reset" onclick="resetFlow()">
        <i class="fa-solid fa-rotate-right"></i> 重新再來
      </button>
      <button class="btn-next" id="nextBtn" onclick="nextStep()">
        下一步 <i class="fa-solid fa-arrow-down"></i>
      </button>
    </div>
  </div>

  <div id="imgModal" class="modal" onclick="closeModal()">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modalImg">
  </div>

  <script>
    const stepsData = [
      {
        title: "1Campus-iVocab2.0 體驗版",
        desc: "依教務系統相同操作方式，在1Campus頁面找到iVocab2.0體驗版點擊進入。",
        image: "step1.png"
      },
      {
        title: "進入iVocab2.0 App頁面",
        desc: "App主頁面，高中六級/國中會考單字可切換。🔍搜尋、星標歸類與iVogo闖關。",
        image: "step2.png"
      },
      {
        title: "高中六級字彙頁面",
        desc: "內建六級單字庫。課程對應：初一L1、初二L2、高一普L3、高二普L4、高三普L5等。",
        image: "step3.png"
      },
      {
        title: "國中會考2000單頁面",
        desc: "供初三綜合複習會考 L1 & L2 單字使用。",
        image: "step4.png"
      },
      {
        title: "單元單字學習(以L3為例)",
        desc: "進入Level3，顯示50個單元（一學年進度）。點擊單元即可開始學習。",
        image: "step5.png"
      },
      {
        title: "單元學習模式1 (瀏覽)",
        desc: "瀏覽模式有例句發音，歸類星標：已精熟/待加強/學習中。滑到底更新學習時間。",
        image: "step6.png"
      },
      {
        title: "單元學習模式2 (閃卡)",
        desc: "閃卡模式：右滑已精熟、左滑待加強、下滑陌生字，快速星標歸類。",
        image: "step7.png"
      },
      {
        title: "單元練習模式",
        desc: "提供三種練習：單字認知(英選中)、單字拼寫、句子填空(AI生成)。可印單字卡。",
        image: "step8.png"
      },
      {
        title: "測驗模式(教師派發)",
        desc: "學生由右上角「☰」選單切換至測驗頁面，限時完成派發測驗（僅限一次機會）。",
        image: "step9.png"
      },
      {
        title: "教師後台管理頁面",
        desc: "教師後台可製作/派發文件夾與測驗、查看/匯總學生練習數據與報表。",
        image: "step10.png"
      },
      {
        title: "製作與派發測驗",
        desc: "後台勾選預檢核的單元單字，即可快速製作並派發測驗給班級學生。",
        image: "step11.png"
      },
      {
        title: "學生數據查看",
        desc: "查看班級學生測驗/練習情況並匯出報表。(需先指派一次任務激活關聯數據)。",
        image: "step12.png"
      }
    ];

    let currentStepIndex = 0;

    window.onload = function() {
      renderStep(currentStepIndex);
      updateUI();
    };

    function renderStep(index) {
      const container = document.getElementById('flowContainer');
      const data = stepsData[index];

      if (index > 0) {
        const arrow = document.createElement('div');
        arrow.className = 'flow-arrow';
        arrow.innerHTML = '<i class="fa-solid fa-chevron-down"></i>';
        container.appendChild(arrow);
      }

      const card = document.createElement('div');
      card.className = 'step-card';
      card.id = `step-card-${index}`;

      const imageHTML = `
        <img src="${data.image}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" alt="步驟畫面">
        <div class="image-placeholder" style="display: none;">
          <i class="fa-solid fa-mobile-screen"></i>
          <div>（未找到圖片：${data.image}）</div>
        </div>
      `;

      card.innerHTML = `
        <div class="phone-mockup" onclick="openModal('${data.image}')">
          <div class="phone-screen">
            ${imageHTML}
          </div>
        </div>
        <div class="step-info">
          <span class="step-badge"><i class="fa-regular fa-bookmark"></i> STEP ${index + 1} / ${stepsData.length}</span>
          <h3>${data.title}</h3>
          <p>${data.desc}</p>
        </div>
      `;

      container.appendChild(card);

      if (index > 0) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function nextStep() {
      if (currentStepIndex < stepsData.length - 1) {
        currentStepIndex++;
        renderStep(currentStepIndex);
        updateUI();
      }
    }

    function resetFlow() {
      currentStepIndex = 0;
      document.getElementById('flowContainer').innerHTML = '';
      renderStep(currentStepIndex);
      updateUI();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* 🖨️ 匯出單頁 12 步驟 Flowchart PDF */
    function exportPDF() {
      const savedIndex = currentStepIndex;
      const container = document.getElementById('flowContainer');
      
      // 1. 暫時將 12 個步驟一次性完整渲染出
      container.innerHTML = '';
      for (let i = 0; i < stepsData.length; i++) {
        renderStep(i);
      }

      // 2. 調起瀏覽器列印視窗（在目標印表機選擇「另存為 PDF」）
      setTimeout(() => {
        window.print();

        // 3. 列印結束後自動回復為原本的組訓進度
        container.innerHTML = '';
        for (let i = 0; i <= savedIndex; i++) {
          renderStep(i);
        }
        currentStepIndex = savedIndex;
        updateUI();
      }, 200);
    }

    function updateUI() {
      const total = stepsData.length;
      const current = currentStepIndex + 1;
      const percentage = (current / total) * 100;

      document.getElementById('progressText').innerText = `進度：步驟 ${current} / ${total}`;
      document.getElementById('progressBar').style.width = `${percentage}%`;

      const nextBtn = document.getElementById('nextBtn');
      if (currentStepIndex === total - 1) {
        nextBtn.disabled = true;
        nextBtn.innerHTML = '已完成全部流程 <i class="fa-solid fa-check"></i>';
        nextBtn.style.background = 'var(--accent-green)';
      } else {
        nextBtn.disabled = false;
        nextBtn.innerHTML = '下一步 <i class="fa-solid fa-arrow-down"></i>';
        nextBtn.style.background = 'var(--primary)';
      }
    }

    function openModal(imgSrc) {
      const modal = document.getElementById("imgModal");
      const modalImg = document.getElementById("modalImg");
      modal.style.display = "flex";
      modalImg.src = imgSrc;
    }

    function closeModal() {
      document.getElementById("imgModal").style.display = "none";
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === "ArrowRight" || event.key === "ArrowDown" || event.key === " ") {
        event.preventDefault();
        nextStep();
      } else if (event.key === "r" || event.key === "R") {
        resetFlow();
      } else if (event.key === "Escape") {
        closeModal();
      }
    });
  </script>
</body>
</html>
