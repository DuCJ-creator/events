<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sopa de Fideo 美食旅遊雙語講座</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#006847;--r:#ce1126;--y:#f4a261;--o:#e76f51;--cream:#fff4e6;--br:#7b2d26;--ink:#2a1a14}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;color:var(--ink);line-height:1.7;
background:var(--cream) radial-gradient(circle at 1px 1px,rgba(123,45,38,.09) 1.5px,transparent 0) 0 0/26px 26px;overflow-x:hidden}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:1}
/* papel picado */
.picado{display:flex;justify-content:space-around;height:46px;overflow:hidden;background:var(--br)}
.picado i{width:34px;height:40px;transform-origin:top center;animation:sway 3s ease-in-out infinite;
clip-path:polygon(0 0,100% 0,100% 70%,85% 100%,70% 70%,50% 100%,30% 70%,15% 100%,0 70%)}
@keyframes sway{50%{transform:rotate(7deg)}0%,100%{transform:rotate(-7deg)}}
body.on .picado i{animation-duration:.9s}
nav{position:sticky;top:0;z-index:50;background:rgba(255,244,230,.93);backdrop-filter:blur(10px);
border-bottom:4px solid var(--g);padding:10px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-weight:800;color:var(--g);font-size:19px}
.nb{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lang{display:flex;background:#eadfce;border-radius:30px;padding:3px}
.lang button{border:0;background:0;padding:6px 14px;border-radius:30px;font:700 13px inherit;cursor:pointer;color:#666}
.lang button.a{background:var(--g);color:#fff}
.btn{border:0;border-radius:30px;padding:10px 22px;font:700 14px inherit;cursor:pointer;color:#fff;text-decoration:none;display:inline-block;
background:var(--r);transition:transform .2s,box-shadow .2s;box-shadow:0 4px 14px rgba(206,17,38,.35)}
.btn:hover{transform:translateY(-3px) scale(1.04)}
.btn.g{background:var(--g);box-shadow:0 4px 14px rgba(0,104,71,.35)}
:focus-visible{outline:3px solid var(--y);outline-offset:3px}
/* hero */
.hero{position:relative;z-index:2;max-width:1100px;margin:36px auto;padding:0 20px}
.hc{background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 18px 50px rgba(123,45,38,.25)}
.hb{background:linear-gradient(120deg,var(--g),#00875a 55%,var(--r));background-size:200% 200%;animation:flow 10s ease infinite;
padding:44px 30px 36px;text-align:center;color:#fff}
@keyframes flow{50%{background-position:100% 50%}}
.bowl{width:170px;display:block;margin:0 auto 6px;transform-origin:50% 90%}
body.on .bowl{animation:dance .46s ease-in-out infinite}
@keyframes dance{50%{transform:rotate(4deg) translateY(-8px)}0%,100%{transform:rotate(-4deg)}}
.steam path{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;opacity:0;animation:rise 2.6s ease-in infinite}
.steam path:nth-child(2){animation-delay:.8s}.steam path:nth-child(3){animation-delay:1.6s}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-12px)}}
.hb h1{font-size:clamp(30px,6vw,52px);letter-spacing:1px;text-shadow:2px 3px 0 rgba(0,0,0,.25)}
.hb h2{font-size:clamp(15px,2.4vw,21px);font-weight:400;margin:8px 0 18px;color:#ffe8d6}
.badge{display:inline-block;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.5);border-radius:30px;padding:8px 22px;font-weight:700}
.hbody{padding:34px 40px}
.hbody p{margin-bottom:16px;font-size:17px}
.hl{background:#fff4e6;border-left:6px solid var(--y);padding:16px 22px;border-radius:12px;color:var(--br);margin:18px 0}
/* sections */
.sec{position:relative;z-index:2;max-width:1100px;margin:44px auto;padding:0 20px}
.st{text-align:center;font-size:clamp(24px,4vw,32px);color:var(--g)}
.ss{text-align:center;color:#777;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.card{background:#fff;border-radius:20px;padding:26px;border-top:6px solid var(--c);box-shadow:0 8px 24px rgba(0,0,0,.1);transition:transform .3s}
.card:hover{transform:translateY(-8px) rotate(-1deg)}
.card:nth-child(1){--c:var(--g)}.card:nth-child(2){--c:var(--r)}.card:nth-child(3){--c:var(--y)}.card:nth-child(4){--c:var(--o)}
.card .ic{font-size:44px;display:block}
.card:hover .ic{animation:wob .6s}
@keyframes wob{25%{transform:rotate(-20deg) scale(1.2)}75%{transform:rotate(20deg) scale(1.2)}}
.card h3{color:var(--g);margin:6px 0}
.card p{font-size:15px;color:#555}
/* steps */
.bar{height:8px;background:#eadfce;border-radius:8px;margin:0 auto 22px;max-width:500px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--y),var(--r));transition:width .5s}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.step{background:#fff;border:2px solid transparent;border-radius:20px;padding:22px 16px;text-align:center;cursor:pointer;font:inherit;color:inherit;
box-shadow:0 6px 20px rgba(0,0,0,.1);transition:all .3s}
.step:hover{border-color:var(--y);transform:translateY(-5px)}
.step.a{background:linear-gradient(135deg,var(--g),#00875a);color:#fff;transform:scale(1.05)}
.step .n{width:48px;height:48px;border-radius:50%;background:var(--cream);color:var(--r);font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.step.a .n{background:rgba(255,255,255,.25);color:#fff;animation:pop .5s}
@keyframes pop{50%{transform:scale(1.35)}}
.step strong{display:block}.step small{font-size:13px;opacity:.8}
.det{display:none;margin-top:20px;background:#fff;border-left:8px solid var(--y);border-radius:18px;padding:24px 28px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.det.show{display:block;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
.det h3{color:var(--r);margin-bottom:8px}
.ctr{text-align:center;margin-top:20px}
/* map */
.map{border-radius:20px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.2);background:#fff}
.map header{background:var(--r);color:#fff;padding:16px 26px}
.map iframe{width:100%;height:380px;border:0;display:block}
footer{position:relative;z-index:2;background:#1c1210;color:#ccc;text-align:center;padding:28px 20px;margin-top:50px;font-size:14px}
.fl{display:flex;height:6px;margin-bottom:16px}.fl i{flex:1}
/* reveal */
.rv{opacity:0;transform:translateY(30px);transition:all .7s}.rv.in{opacity:1;transform:none}
/* music fab */
#mus{position:fixed;right:18px;bottom:18px;z-index:99;border:0;border-radius:40px;padding:12px 20px;cursor:pointer;color:#fff;font:700 15px inherit;
background:linear-gradient(135deg,var(--r),var(--o));box-shadow:0 8px 24px rgba(206,17,38,.5);display:flex;align-items:center;gap:10px;animation:beat 1.6s infinite}
body.on #mus{animation:none;background:linear-gradient(135deg,var(--g),#00875a)}
@keyframes beat{50%{transform:scale(1.08)}}
.eq{display:flex;gap:3px;align-items:flex-end;height:18px}
.eq i{width:4px;height:5px;background:#fff;border-radius:2px}
body.on .eq i{animation:eq .5s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.12s!important}.eq i:nth-child(3){animation-delay:.25s!important}.eq i:nth-child(4){animation-delay:.07s!important}
@keyframes eq{to{height:18px}}
@media(max-width:700px){.hbody{padding:24px}nav{justify-content:center}.map iframe{height:280px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}canvas#fx{display:none}}
@media print{nav,.sec.np,footer,#mus,canvas,.picado{display:none!important}body{background:#fff}}
</style>
</head>

        <path d="M20 72h160c0 50-30 80-80 80S20 122 20 72z" fill="#ce1126"/>

const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
let lang='zh',cur=0,tour=null,playing=false;
try{lang=localStorage.getItem('lang')||'zh'}catch(e){}

  $('#mlab').textContent=playing?t.moff:t.mon;
  document.title=t.nav;
  if(cur){$('#dt').textContent=`${t.step} ${cur}：${t['t'+cur]}`;$('#dc').textContent=t['d'+cur]}
}
function show(n){cur=n;$('#det').classList.add('show');$('#prog').style.width=n*25+'%';render()}
document.addEventListener('click',e=>{
  const l=e.target.closest('[data-l]');if(l){lang=l.dataset.l;try{localStorage.setItem('lang',lang)}catch(x){}render()}
  const s=e.target.closest('.step');if(s){stopTour();show(+s.dataset.n)}
});
function stopTour(){clearInterval(tour);tour=null;$('#auto').textContent=T[lang].play}
$('#auto').onclick=()=>{
  if(tour){stopTour();return}
  show(cur%4+1);tour=setInterval(()=>show(cur%4+1),3500);render();
};
$('#pdf').onclick=e=>{e.preventDefault();/* 🔴 請替換為您的講義網址 */window.open('https://ducj-creator.github.io/events/fideohd.html','_blank')};

/* ===== 墨西哥彩旗 ===== */
const cols=['#ce1126','#f4a261','#006847','#ffd23f','#e76f51','#fff4e6','#2a9d8f'];
$('#picado').innerHTML=Array.from({length:30},(_,i)=>`<i style="background:${cols[i%7]};animation-delay:${-i*.2}s"></i>`).join('');

/* ===== 飄落的墨西哥元素 ===== */
const cv=$('#fx'),cx=cv.getContext('2d'),em=['🌮','🌶️','🍅','🥑','🍋','🪅','🎺','🌽'];
let W,H;const fit=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};fit();addEventListener('resize',fit);
const ps=Array.from({length:18},()=>({x:Math.random()*W,y:Math.random()*H,s:16+Math.random()*18,v:.4+Math.random()*.8,r:Math.random()*6,e:em[Math.random()*8|0]}));
(function loop(){
  cx.clearRect(0,0,W,H);
  const k=document.body.classList.contains('on')?2.6:1;
  ps.forEach(p=>{p.y+=p.v*k;p.r+=.01*k;if(p.y>H+30){p.y=-30;p.x=Math.random()*W}
    cx.save();cx.translate(p.x+Math.sin(p.r)*20,p.y);cx.rotate(Math.sin(p.r)*.5);cx.globalAlpha=.55;cx.font=p.s+'px serif';cx.fillText(p.e,0,0);cx.restore()});
  requestAnimationFrame(loop);
})();

/* ===== 捲動出現 ===== */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
$$('.rv').forEach(e=>io.observe(e));

/* ===== 合成 Mariachi 音樂（Web Audio，不需外部檔案）===== */
let ac,mg,nb,nxt=0,stp=0,tm;
const BPM=138,S=60/BPM/2,f=m=>440*2**((m-69)/12);
const CH={C:[60,64,67],G:[59,62,67],F:[57,60,65]},R={C:48,G:43,F:41},FI={C:43,G:50,F:48};
const prog=['C','G','C','F','C','G','C','C'];
const mel=[[76,0,76,74,72,0,67,0],[74,0,74,72,71,0,67,0],[72,0,76,0,79,0,76,0],[77,0,77,76,74,0,72,0],
[76,0,76,74,72,0,67,0],[74,0,71,0,74,0,71,0],[72,76,79,76,72,0,0,0],[84,0,0,0,0,0,0,0]];
function tone(m,t,d,type,v,cut){
  const o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();
  o.type=type;o.frequency.value=f(m);fl.type='lowpass';fl.frequency.value=cut;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(fl);fl.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05);
}
function shake(t,v){
  const s=ac.createBufferSource(),g=ac.createGain(),h=ac.createBiquadFilter();
  s.buffer=nb;h.type='highpass';h.frequency.value=6000;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);
  s.connect(h);h.connect(g);g.connect(mg);s.start(t);s.stop(t+.08);
}
function note(i,t){
  const bar=i>>3,b=i&7,c=prog[bar];
  if(b%4===0)tone(R[c],t,.28,'triangle',.5,500);          // 低音貝斯（根音）
  if(b%4===2)tone(FI[c],t,.22,'triangle',.4,500);         // 五度音
  if(b%2===1)CH[c].forEach((m,k)=>tone(m,t+k*.012,.22,'sawtooth',.07,2400)); // 吉他刷弦
  const m=mel[bar][b];
  if(m){tone(m,t,S*1.7,'sawtooth',.11,2000);tone(m-4,t,S*1.7,'sawtooth',.06,1800)} // 小號（三度和聲）
  shake(t,b%2?.16:.08);
}
function sched(){while(nxt<ac.currentTime+.18){note(stp,nxt);nxt+=S;stp=(stp+1)%64}}
function toggleMusic(){
  if(!ac){
    ac=new(window.AudioContext||window.webkitAudioContext)();
    mg=ac.createGain();mg.gain.value=.5;mg.connect(ac.destination);
    nb=ac.createBuffer(1,ac.sampleRate*.1,ac.sampleRate);
    const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  playing=!playing;
  if(playing){ac.resume();nxt=ac.currentTime+.05;stp=0;tm=setInterval(sched,25)}
  else{clearInterval(tm);ac.suspend()}
  document.body.classList.toggle('on',playing);
  $('#mus').setAttribute('aria-pressed',playing);render();
}
$('#mus').onclick=toggleMusic;
render();
</script>
