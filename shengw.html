<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Composition Contest — Preparation Pack</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--bd:#e3dfd5;--gold:#9a7a2e;--ink:#1d2433;--dim:#4d566a;--chip:#f3ecd9;--serif:'Newsreader',Georgia,serif;--sans:'Inter',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--card:#161e32;--bd:#2a3350;--gold:#d2ae65;--ink:#e9ebf1;--dim:#a9b1c3;--chip:#2a2a2a}}
:root[data-theme="dark"]{--bg:#0f1524;--card:#161e32;--bd:#2a3350;--gold:#d2ae65;--ink:#e9ebf1;--dim:#a9b1c3;--chip:#2a2a2a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);padding:48px 16px 80px}
.wrap{max-width:760px;margin:0 auto}
h1{font-family:var(--serif);font-weight:500;font-size:26px;margin:0 0 6px}
.who{font-size:12.5px;color:var(--dim);margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:12px;overflow:hidden}
.card.open{border-color:var(--gold)}
.hd{width:100%;display:flex;gap:14px;align-items:center;padding:16px 18px;background:none;border:0;cursor:pointer;text-align:left;color:inherit;font-family:inherit}
.n{font-family:var(--serif);font-style:italic;color:var(--gold);width:22px}
.hd b{display:block;font-family:var(--serif);font-weight:500;font-size:17px}
.hd small{font-size:12.5px;color:var(--dim)}
.bd{display:none;padding:0 20px 22px 54px;font-size:14.5px;line-height:1.7;color:var(--dim)}
.card.open .bd{display:block}
h3{font-family:var(--serif);font-weight:500;font-size:15px;color:var(--ink);margin:16px 0 6px}
p{margin:0 0 10px}ul{padding-left:18px;margin:0 0 10px}li{margin-bottom:6px}
strong{color:var(--ink)}em{color:var(--gold);font-style:normal;font-weight:600}
.v{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.v span{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--chip);border:1px solid var(--bd);color:var(--ink)}
.v i{font-style:normal;color:var(--dim);margin-left:4px}
.pl{display:flex;gap:10px;margin:8px 0;padding:8px 12px;border-left:2px solid var(--gold);font-size:14px}
.pl b{color:var(--gold);width:18px;flex-shrink:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tb{font:inherit;font-size:12.5px;padding:7px 12px;border-radius:8px;border:1px solid var(--bd);background:none;color:var(--dim);cursor:pointer}
.tb.on{border-color:var(--gold);color:var(--gold)}
.es{display:none}.es.on{display:block}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin-bottom:12px}
td,th{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
.sc{overflow-x:auto}
@media(max-width:560px){.bd{padding-left:20px}}
</style></head><body><div class="wrap">
<h1>Senior High School<br>Composition Contest — Preparation Pack</h1>
<div class="who">Shirley Du · CHHS</div>
<div id="acc"></div></div>
<script>
const V=a=>'<div class="v">'+a.map(x=>'<span>'+x[0]+'<i>'+x[1]+'</i></span>').join('')+'</div>';
const tbl=(h,r)=>'<div class="sc"><table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+r.map(x=>'<tr>'+x.map(y=>'<td>'+y+'</td>').join('')+'</tr>').join('')+'</table></div>';
const PL=a=>a.map(x=>'<div class="pl"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('');
const E=[
["Growth & Preservation","The Tension Between Growth and Preservation",
"Taiwan is rich in natural beauty, from Jade Mountain to Taroko Gorge. <em>But</em> it also stands at a hard crossroads between growth and protection. For decades we put factories first, and that choice made us one of the “Asian Tigers.” <em>Yet</em> our identity is not built on steel and chips alone; it also depends on our bond with the land. <em>Therefore</em>, we need growth that protects nature instead of using it up.",
[["P","<em>First</em>, at the local level, ordinary people are often the strongest defenders of the environment."],
["E","<em>For example</em>, after the Hualien disasters, volunteers called the “Heroes of Shovel” walked into mud-covered villages to clean up."],
["E","<em>This shows</em> that protecting our homeland is not only a technical job; it is a shared value rooted in care."],
["L","<em>As a result</em>, local action builds the habits a greener society needs."],
["P","<em>Second</em>, national policy must show the same care."],
["E","<em>In 2021</em>, Taiwan suffered its worst drought in about 56 years, and the debate over water use by chip factories grew sharply."],
["E","<em>This means</em> that growth ignoring water will eventually limit itself."],
["L","<em>Therefore</em>, the government should treat conservation as part of growth, not its enemy."],
["P","<em>Finally</em>, a healthy environment supports Taiwan’s role as a good global citizen."],
["E","<em>For instance</em>, “Taiwan Can Help” began with medical supplies, but it can also reach into ocean protection and biodiversity."],
["E","<em>If</em> we fail to protect our land, <em>then</em> we lose the very beauty that earned the name “Formosa.”"],
["L","<em>In short</em>, environmental care is part of our international strength, not only a local issue."]],
"<em>In conclusion</em>, this tension tests our shared wisdom. Economic success does not have to cost us our natural heritage. By protecting the land, we leave a greener future for the next generation."],
["Strength in Diversity","Strength in Diversity",
"Taiwan’s culture is woven from many groups: Indigenous peoples, Hakka, Hokkien, post-1949 migrants and new residents. <em>Although</em> Indigenous peoples make up only about 2.5% of the population, their 16 recognized groups shape our music, food and language. <em>Therefore</em>, diversity is not a problem to manage but a strength to use.",
[["P","<em>First</em>, everyday kindness shows that respect for others is part of Taiwanese life."],
["E","<em>For example</em>, many people give up seats or offer directions to foreign visitors without being asked."],
["E","<em>This shows</em> that hospitality is a living tradition built on empathy, not a rule written in law."],
["L","<em>As a result</em>, small acts of kindness become the base of a tolerant community."],
["P","<em>Second</em>, shared festivals bring different groups together."],
["E","<em>During</em> the Mazu pilgrimage and Mid-Autumn Festival, Hakka, Hokkien and new-resident families share food and stories."],
["E","<em>This means</em> that harmony comes from cooperation among different traditions, not from making them the same."],
["L","<em>Therefore</em>, festivals work like glue that keeps a diverse society together."],
["P","<em>Finally</em>, diversity gives Taiwan a voice abroad."],
["E","<em>In 2019</em>, Taiwan became the first place in Asia to legalize same-sex marriage, showing a “live and let live” attitude."],
["E","<em>Because of this</em>, Taiwan is seen as a democracy that protects human rights."],
["L","<em>In short</em>, inside diversity is the source of our moral authority outside."]],
"<em>In conclusion</em>, Taiwan welcomes many backgrounds while staying united. Through daily kindness and fair laws, diversity will keep guiding Taiwan as a beam of hope in the world."],
["Digital Responsibility","Digital Responsibility in the Age of AI",
"In the AI era, technology brings a wealth of information, <em>but</em> it can also weaken trust between people. <em>Because</em> about nine in ten Taiwanese people now use the internet, what we post affects almost everyone around us. <em>Therefore</em>, digital responsibility is no longer only a skill; it is a moral duty.",
[["P","<em>First</em>, honesty online is the best protection for public trust."],
["E","<em>For example</em>, during the Hualien disaster, citizens used the internet to organize the “Heroes of Shovel” without seeking personal gain."],
["E","<em>This shows</em> that technology guided by conscience becomes a source of hope in a crisis."],
["L","<em>As a result</em>, our online actions should match our real-world care for others."],
["P","<em>Second</em>, a warm online community is built by many small choices."],
["E","<em>In 2020</em>, “Taiwan Can Help” spread around the world as a sign of our willingness to assist during COVID-19."],
["E","<em>If</em> we choose kindness over false information, <em>then</em> we strengthen the image of a caring and capable Taiwan."],
["L","<em>Therefore</em>, digital responsibility is an extension of character education."],
["P","<em>Finally</em>, ethical use of technology protects human dignity."],
["E","<em>Without</em> empathy, AI and social media can push people apart and spread chaos."],
["E","<em>As global citizens</em>, we must design and use new inventions with everyone in mind."],
["L","<em>In short</em>, only human values combined with digital power can lead to a bright future."]],
"<em>In conclusion</em>, technology changes our tools, not the values of the heart. If we bring our hospitality and resilience into the digital world, we can build a future that is both advanced and humane."]];
const essays='<div class="tabs">'+E.map((e,i)=>'<button class="tb'+(i?'':' on')+'" data-i="'+i+'">'+e[0]+'</button>').join('')+'</div>'+E.map((e,i)=>'<div class="es'+(i?'':' on')+'" id="e'+i+'"><h3>'+e[1]+'</h3><p><strong>Introduction</strong> — '+e[2]+'</p>'+PL(e[3])+'<p><strong>Conclusion</strong> — '+e[4]+'</p></div>').join('');
const C=[
["I","Key Features of the Writing Prompts","How prompts changed, 111–114, and the four themes",
"<p>From 111 to 114, prompts moved from abstract questions toward the link between personal identity and society. Good English alone is not enough; you must connect your own experience to a national story.</p><h3>Four themes</h3><ul><li><strong>Abstract Ethics (111)</strong> — why ethics matter for a united society.</li><li><strong>Future Ideas (112)</strong> — an invention that makes the world better and more harmonious.</li><li><strong>Social Debate (113)</strong> — technology as a source of information <em>and</em> of harm.</li><li><strong>Cultural Reflection (114)</strong> — the core beliefs that define Taiwanese identity and its intangible cultural heritage.</li></ul><p>The 114 prompt asks you to describe what kind of community Taiwan is through shared values, not just to list traditions.</p>"],
["II","Excellence: How","Three pillars behind winning essays",
"<p>Winning essays show depth of thinking and use <strong>current-event examples</strong> to prove civic awareness.</p><h3>1. Emotional link to Taiwan</h3><p>Connect a personal story to the national spirit, such as the “Heroes of Shovel” who went to Hualien, driven by conscience.</p><h3>2. Clear, simple vocabulary</h3><p>Use words you can spell and use correctly. A plain word used well scores higher than a rare word used wrongly.</p>"+V([["teamwork","合作"],["determined","堅定的"],["widespread","普遍的"],["signs","表現"],["many","許多"],["a wide range of","各式各樣的"]])+"<h3>3. Specific → Universal</h3><p>Move from a personal example to a national or global meaning. “Taiwan Can Help” is a good bridge to Taiwan’s role as a global citizen.</p>"],
["III","Key Preparation Tips","Four habits for competition day",
"<h3>1. Map the 19 issues</h3><p>Match the 108 Curriculum issues to likely prompts. For example, Gender Equity Education fits a multicultural prompt through same-sex marriage and “live and let live.”</p><h3>2. Use PEEL with linking words</h3><p><strong>Point → Evidence → Explanation → Link.</strong> Start each sentence with a connector so the reader can follow your logic (see section VIII). The Explanation must say <em>why</em> the evidence matters.</p><h3>3. Build a story bank</h3><p>One volunteering story can fit Character Education, Disaster Prevention or Social Participation.</p><h3>4. Build a data bank</h3><p>Collect 5–6 reliable numbers and practise describing their change (see section VII).</p>"],
["IV","Suggested Writing Prompts","Three practice prompts",
"<h3>Prompt 1 · Environmental Education</h3><p>Taiwan is an island in the Pacific with rich natural treasures, yet industry often threatens them. Describe a specific environmental challenge and how society can balance growth and protection.</p><h3>Prompt 2 · Multicultural Education</h3><p>Taiwan’s identity is a mix of Indigenous, Hakka and immigrant influences. Discuss the challenges and benefits of a diverse society and how inclusiveness builds harmony.</p><h3>Prompt 3 · Technology / Information Education</h3><p>Modern technology offers great potential but can damage trust. Describe the responsibility individuals hold and how online actions show respect for human dignity.</p>"],
["V","Cracking Each Prompt","Goal, “so what?” angle and word bank",
"<h3>Blueprint 1 — Environment</h3><p><strong>Goal:</strong> balance economic benefit and care for nature.<br><strong>So what?</strong> Conservation is fairness to future generations.</p>"+V([["famous for","以…聞名"],["balance","平衡"],["risky","有風險的"],["protect","保護"],["good cycle","良性循環"],["responsibility","責任"]])+"<h3>Blueprint 2 — Multicultural</h3><p><strong>Goal:</strong> a shared identity grows from many cultures.<br><strong>So what?</strong> Tolerance is an active skill, not passive acceptance.</p>"+V([["empathy","同理心"],["teamwork","合作"],["respect","尊重"],["many-sided","多面向的"],["deep-rooted","根深蒂固的"],["harmony","和諧"]])+"<h3>Blueprint 3 — Technology</h3><p><strong>Goal:</strong> define human ethics in the age of AI.<br><strong>So what?</strong> Digital responsibility shows self-respect; technology can give hope, not chaos.</p>"+V([["breakthrough","突破"],["digital footprint","數位足跡"],["show","展現"],["shared effort","集體努力"],["everywhere","無所不在的"],["careful","仔細的"]])],
["VI","Model Essays","Revised: simpler words, linking words in gold",
essays+"<p style='margin-top:14px'><strong>Tip:</strong> the <em>gold words</em> are the connectors that show how each sentence follows the last.</p>"],
["VII","Describing Data Changes","Verbs, patterns and a safe way to use numbers",
"<h3>Change verbs</h3>"+tbl(["Direction","Normal","Strong (big change)","Weak (small change)"],[["Up","rise, increase, grow","surge, soar, jump","edge up, creep up"],["Down","fall, drop, decrease","plunge, plummet","dip, ease"],["Steady","stay stable, remain steady","—","level off, hold at"]])+"<h3>Sentence patterns</h3><ul><li>The number of X <em>rose from</em> 20% <em>to</em> 35% <em>between</em> 2015 <em>and</em> 2023.</li><li>X <em>increased by</em> 15 percentage points / <em>by</em> about 40%.</li><li>X <em>doubled</em> / <em>tripled</em> / <em>was cut in half</em> over the decade.</li><li><em>Compared with</em> 2010, X <em>fell sharply</em> to just under one in three.</li><li>X <em>remained stable at</em> around 60% <em>throughout</em> the period.</li></ul><h3>Size words</h3><p>about, roughly, nearly, just over, more than, one in three, a majority, a small minority.</p><h3>Then explain the change</h3><p>Number → meaning → link: “X <em>rose sharply</em>. <em>This suggests</em> that people care more about it. <em>As a result</em>, schools should…”</p><h3>Rules</h3><ul><li>“Percent” is a ratio; “percentage points” is the gap between two percents.</li><li>Use only figures you are sure of, with “about” or “roughly.” Check them before the contest.</li></ul>"],
["VIII","Linking Words for Logic","Make every sentence follow the one before",
tbl(["Job","Use"],[["Add","In addition, Moreover, Also"],["Contrast","However, Yet, Although, On the other hand"],["Example","For example, For instance, Specifically"],["Cause → result","Because of this, As a result, Therefore, So"],["Condition","If… then…, Without…, Unless…"],["Explain","This shows that, This means that, This suggests that"],["Order","First, Second, Finally"],["End","In short, Overall, In conclusion"]])+"<h3>Template chain</h3><p><strong>Point</strong> (First, …) → <strong>Evidence</strong> (For example, …) → <strong>Explanation</strong> (This shows that…) → <strong>Link</strong> (As a result / Therefore, …)</p><p>Check: if you delete the connector, can the reader still tell <em>why</em> sentence B follows sentence A? If not, add a reason.</p>"]];
const acc=document.getElementById('acc');
acc.innerHTML=C.map(c=>'<div class="card"><button class="hd"><span class="n">'+c[0]+'</span><span><b>'+c[1]+'</b><small>'+c[2]+'</small></span></button><div class="bd">'+c[3]+'</div></div>').join('');
acc.addEventListener('click',e=>{const h=e.target.closest('.hd');if(h)h.parentElement.classList.toggle('open');
const t=e.target.closest('.tb');if(t){const p=t.closest('.bd');p.querySelectorAll('.tb,.es').forEach(x=>x.classList.remove('on'));t.classList.add('on');p.querySelector('#e'+t.dataset.i).classList.add('on')}});
</script></body></html>
